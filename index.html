// Keep progressbar aria-valuenow in sync with width (observes style changes)
(function(){
  const pb = document.getElementById('progressBar');
  if(!pb) return;
  const updateAria = ()=>{
    const parent = pb.parentElement;
    if(!parent) return;
    const pw = parent.clientWidth || 1;
    const w = pb.clientWidth || 0;
    const pct = Math.round((w / pw) * 100);
    pb.setAttribute('aria-valuenow', String(Math.max(0, Math.min(100, pct))));
  };
  // initial
  updateAria();
  // Observe style attribute changes
  const mo = new MutationObserver(()=>updateAria());
  mo.observe(pb, {attributes:true,attributeFilter:['style']} );
  // also update on window resize
  window.addEventListener('resize', updateAria);
})();
